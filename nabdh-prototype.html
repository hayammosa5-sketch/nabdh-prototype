const { useState, useEffect, useRef } = React;
const { MessageCircle, Mic, Bell, Send, Play, Pause, Sparkles, Volume2 } = window.LucideReact;

/*
  Design tokens — Nabdh (نبض / "Pulse")
  Palette:
    parchment   #F6EEDA  — base background, warm hand-inked paper
    ink         #3E3A34  — primary text, soft charcoal not pure black
    skyMist     #7EC8DE  — primary accent, spirited-away sky
    leaf        #7C9B6C  — secondary accent, forest green
    ember       #E8935C  — warm accent, sunset / urgency
    lavender    #B9A6D1  — soft highlight, dusk glow
  Type:
    Display: "Baloo 2" (rounded, hand-drawn warmth)
    Body:    "Nunito" (friendly, legible)
  Signature element: the Awly robot mascot — a full-body figure with an
  antenna, soft ear pieces, and a dark screen face whose cyan eyes and
  mouth animate in sync with speech. Its expression is never chosen by
  hand: Nabdh reads each message's text and sets the mood automatically
  (see detectMood / MOOD_STYLES below).
*/

const FONT_IMPORT_URL =
  "https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap";

const TOKENS = {
  parchment: "#F6EEDA",
  parchmentDeep: "#EFE3C7",
  ink: "#3E3A34",
  inkSoft: "#6B6458",
  sky: "#7EC8DE",
  skyDeep: "#4FA8C4",
  leaf: "#7C9B6C",
  leafDeep: "#5F8250",
  ember: "#E8935C",
  emberDeep: "#D2703A",
  lavender: "#B9A6D1",
  card: "#FFFDF7",
};

/*
  Automatic mood engine.
  The person never picks an emotion by hand — Nabdh reads the text of
  each message and derives the character's mood from it. This is a
  lightweight keyword/punctuation model standing in for the real
  sentiment model the production app would call; swap detectMood's body
  for an API call and everything downstream (expression, color, motion)
  keeps working unchanged.
*/
const MOOD_STYLES = {
  happy: { hue: TOKENS.leaf, eyeDy: -7.5, mouthDy: 6, lift: 1.5, labelAr: "سعيد", emoji: "🙂" },
  calm: { hue: TOKENS.sky, eyeDy: -5, mouthDy: 4, lift: 0, labelAr: "هادئ", emoji: "😌" },
  excited: { hue: TOKENS.ember, eyeDy: -9, mouthDy: 7, lift: 3, labelAr: "متحمس", emoji: "🤩" },
  sad: { hue: TOKENS.lavender, eyeDy: 5, mouthDy: -5, lift: -1.5, labelAr: "حزين", emoji: "😔" },
  angry: { hue: TOKENS.emberDeep, eyeDy: 2, mouthDy: -6, lift: -2.5, labelAr: "غاضب", emoji: "😠" },
};

const SAD_HINTS = ["حزين", "زعلان", "تعبان", "تعبت", "متضايق", "وحيد", "أسفة", "آسف", "😢", "💔", "😞"];
const ANGRY_HINTS = ["غاضب", "عصبي", "مستفز", "زعلت مني", "طفشان", "مو راضي", "😠", "😡", "🤬"];
const EXCITED_HINTS = ["!", "يجنن", "رهيب", "حماس", "🔥", "😍", "واو", "ماشاء الله"];
const HAPPY_HINTS = ["حلو", "سعيد", "فرحان", "😊", "🌾", "الحمدلله", "يعطيك العافية"];

function detectMood(text) {
  const t = (text || "").trim();
  if (!t) return "calm";
  if (ANGRY_HINTS.some((w) => t.includes(w))) return "angry";
  if (SAD_HINTS.some((w) => t.includes(w))) return "sad";
  if (EXCITED_HINTS.some((w) => t.includes(w))) return "excited";
  if (HAPPY_HINTS.some((w) => t.includes(w))) return "happy";
  return "calm";
}

function useLipSync(active) {
  const [mouth, setMouth] = useState(0.3);
  useEffect(() => {
    if (!active) {
      setMouth(0.2);
      return;
    }
    let raf;
    let t = 0;
    const tick = () => {
      t += 0.18;
      const wobble = Math.abs(Math.sin(t * 2.3)) * 0.7 + Math.abs(Math.sin(t * 5.1)) * 0.3;
      setMouth(0.25 + wobble * 0.75);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [active]);
  return mouth;
}

function SpiritFace({ mood = "calm", speaking = false, size = 64, hue }) {
  const mouthOpen = useLipSync(speaking);
  const style = MOOD_STYLES[mood] || MOOD_STYLES.calm;
  const resolvedHue = hue || style.hue;
  const eyeLift = style.lift;
  const idleCurve = Math.max(0, 1 - mouthOpen * 1.6);
  const height = size * 1.55;

  return (
    <div
      style={{
        width: size,
        height,
        position: "relative",
        filter: speaking ? `drop-shadow(0 0 14px ${resolvedHue}88)` : "none",
        transition: "filter 0.3s ease",
        animation: speaking ? "bodyBob 0.55s ease-in-out infinite" : "none",
      }}
    >
      {/* aura */}
      <div
        style={{
          position: "absolute",
          inset: "6% 0%",
          borderRadius: "40%",
          background: `radial-gradient(ellipse at 50% 30%, ${resolvedHue}50, transparent 70%)`,
          animation: speaking ? "auraPulse 1.1s ease-in-out infinite" : "none",
        }}
      />
      {/* Awly — full-body robot, no circular frame */}
      <svg viewBox="0 0 100 155" width={size} height={height} style={{ position: "relative" }}>
        <defs>
          <linearGradient id={`body-${resolvedHue}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#FBC56B" />
            <stop offset="100%" stopColor="#F5A83C" />
          </linearGradient>
        </defs>

        {/* arms — fold inward across the chest when angry, otherwise relaxed at the sides */}
        <g
          stroke="none"
          style={{
            transformBox: "fill-box",
            transformOrigin: "50% 50%",
          }}
        >
          <rect
            x="13"
            y="76"
            width="13"
            height="40"
            rx="6.5"
            fill={`url(#body-${resolvedHue})`}
            transform={mood === "angry" ? "rotate(50 19.5 96)" : "rotate(-7 19.5 96)"}
            style={{ transition: "transform 0.35s ease" }}
          />
          <circle cx={mood === "angry" ? 46 : 18} cy={mood === "angry" ? 88 : 115} r="8.5" fill="#2A2A2E" style={{ transition: "cx 0.35s ease, cy 0.35s ease" }} />
          <rect
            x="74"
            y="76"
            width="13"
            height="40"
            rx="6.5"
            fill={`url(#body-${resolvedHue})`}
            transform={mood === "angry" ? "rotate(-50 80.5 96)" : "rotate(7 80.5 96)"}
            style={{ transition: "transform 0.35s ease" }}
          />
          <circle cx={mood === "angry" ? 54 : 82} cy={mood === "angry" ? 88 : 115} r="8.5" fill="#2A2A2E" style={{ transition: "cx 0.35s ease, cy 0.35s ease" }} />
        </g>

        {/* legs — right leg stomps repeatedly while angry */}
        <rect x="30" y="118" width="16" height="30" rx="6" fill={`url(#body-${resolvedHue})`} />
        <g style={{ animation: mood === "angry" ? "stompLeg 0.5s ease-in-out infinite" : "none", transformBox: "fill-box", transformOrigin: "50% 0%" }}>
          <rect x="54" y="118" width="16" height="30" rx="6" fill={`url(#body-${resolvedHue})`} />
          <rect x="52" y="132" width="20" height="8" rx="4" fill="#2A2A2E" />
          <ellipse cx="62" cy="150" rx="11" ry="6" fill="#E8935C" />
        </g>
        <rect x="28" y="132" width="20" height="8" rx="4" fill="#2A2A2E" />
        <ellipse cx="38" cy="150" rx="11" ry="6" fill="#E8935C" />

        {/* torso */}
        <rect x="24" y="70" width="52" height="52" rx="22" fill={`url(#body-${resolvedHue})`} stroke="#C97F2A" strokeOpacity="0.2" strokeWidth="1.2" />
        <path d="M36 92 h10 l4 6 h8" stroke="#C97F2A" strokeOpacity="0.4" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" />

        {/* head group — tilts and sways when sad, nods gently when happy */}
        <g
          style={{
            transformBox: "fill-box",
            transformOrigin: "50% 100%",
            animation:
              mood === "sad"
                ? "headTiltSway 1.8s ease-in-out infinite"
                : mood === "happy"
                ? "headNod 0.9s ease-in-out infinite"
                : "none",
            transition: "transform 0.3s ease",
          }}
        >
        {/* antenna — droops slightly for a sad mood */}
        <line
          x1="50"
          y1="18"
          x2={mood === "sad" ? 46 : 50}
          y2={mood === "sad" ? 9 : 6}
          stroke={TOKENS.ink}
          strokeOpacity="0.35"
          strokeWidth="2.2"
          strokeLinecap="round"
        />
        <circle cx={mood === "sad" ? 46 : 50} cy={mood === "sad" ? 9 : 6} r="4" fill={resolvedHue} />

        {/* ears */}
        <rect x="8" y="38" width="12" height="24" rx="6" fill="#C7D3D6" stroke={TOKENS.ink} strokeOpacity="0.12" />
        <rect x="80" y="38" width="12" height="24" rx="6" fill="#C7D3D6" stroke={TOKENS.ink} strokeOpacity="0.12" />
        <circle cx="14" cy="50" r="2.8" fill="#8FA3A8" />
        <circle cx="86" cy="50" r="2.8" fill="#8FA3A8" />

        {/* head */}
        <rect x="17" y="17" width="66" height="60" rx="24" fill={`url(#body-${resolvedHue})`} stroke="#C97F2A" strokeOpacity="0.25" strokeWidth="1.4" />

        {/* screen */}
        <rect x="27" y="30" width="46" height="36" rx="14" fill="#181A1F" />

        {/* eyes: curve direction/height set by the detected mood */}
        <path
          d={`M34 ${46 - eyeLift} q6.5 ${style.eyeDy} 13 0`}
          stroke={resolvedHue}
          strokeWidth="3.6"
          strokeLinecap="round"
          fill="none"
        />
        <path
          d={`M53 ${46 - eyeLift} q6.5 ${style.eyeDy} 13 0`}
          stroke={resolvedHue}
          strokeWidth="3.6"
          strokeLinecap="round"
          fill="none"
        />

        {/* idle mouth curve (smile or frown per mood), fades as it opens to speak */}
        <path
          d={`M41 59 q9 ${style.mouthDy} 18 0`}
          stroke="#EAF9FB"
          strokeWidth="2.8"
          strokeLinecap="round"
          fill="none"
          opacity={idleCurve}
        />

        {/* open mouth for lip-sync while speaking */}
        <ellipse
          cx="50"
          cy="59"
          rx={mood === "excited" ? 10 : 8}
          ry={mouthOpen * 8}
          fill="#0B0C10"
          opacity={speaking ? 1 : 0}
        />
        <rect
          x="43.5"
          y={59 - mouthOpen * 8}
          width="13"
          height={Math.max(0, mouthOpen * 3)}
          rx="1.8"
          fill="#EAF9FB"
          opacity={speaking ? 0.9 : 0}
        />
        </g>
      </svg>
    </div>
  );
}

            borderRadius: 2,
            background: TOKENS.skyDeep,
            height: active ? undefined : 4,
            animation: active ? `bar 0.9s ease-in-out ${i * 0.06}s infinite` : "none",
            opacity: active ? 1 : 0.35,
          }}
        />
      ))}

  );
}

const MESSAGES = [
  { id: 1, from: "them", name: "أولي", text: "وصلت البيت أخيراً 🌾 اليوم كان طويل بس حلو" },
  { id: 2, from: "me", text: "الحمدلله ع السلامة، خذي راحتك الليلة" },

  const [playingId, setPlayingId] = useState(3);

  return (

        style={{
          padding: "10px 16px 12px",
          borderBottom: `1px solid ${TOKENS.parchmentDeep}`,

          alignItems: "center",
          gap: 10,

        <SpiritFace size={38} mood="calm" speaking={false} />
        <div>
          <div style={{ fontFamily: "Baloo 2, sans-serif", fontWeight: 700, fontSize: 15, color: TOKENS.ink }}>
            أولي
          </div>
          <div style={{ fontFamily: "Nunito, sans-serif", fontSize: 11, color: TOKENS.leafDeep }}>
            ● متصلة الآن
          </div>

      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "20px 16px", display: "flex", flexDirection: "column", gap: 30 }}>
        {MESSAGES.map((m) => {
          const isThem = m.from === "them";
          const isPlaying = playingId === m.id;
          const detected = isThem ? detectMood(m.text) : null;
          const style = detected ? MOOD_STYLES[detected] : null;

          if (!isThem) {
            // sent messages: plain text, no bubble, just quiet alignment
            return (
              <div key={m.id} style={{ display: "flex", justifyContent: "flex-end" }}>
                <div
                  style={{
                    maxWidth: 200,
                    fontFamily: "Nunito, sans-serif",
                    fontSize: 13,
                    lineHeight: 1.5,
                    color: TOKENS.leafDeep,
                    fontWeight: 700,
                    direction: "rtl",
                    textAlign: "right",
                    // explicitly bubble-free: no container behind the words

                    border: "none",
                    boxShadow: "none",
                    borderRadius: 0,
                    padding: 0,
                    margin: 0,
                  }}
                >
                  {m.text}

              </div>
            );
          }

          // incoming messages: the character IS the message — large, centered, front and center.
          // Mood is never chosen by the sender; Nabdh reads the text and sets it automatically.
          return (
            <div
              key={m.id}
              onClick={() => setPlayingId(isPlaying ? null : m.id)}
              style={{
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                gap: 10,
                cursor: "pointer",
                padding: "6px 4px",
              }}
            >
              <div
                style={{
                  transform: isPlaying ? "scale(1.14)" : "scale(1)",
                  transition: "transform 0.35s cubic-bezier(.34,1.56,.64,1)",
                }}
              >
                <SpiritFace size={104} mood={detected} speaking={isPlaying} />
              </div>
              <div
                style={{
                  maxWidth: 240,
                  fontFamily: "Nunito, sans-serif",
                  fontSize: isPlaying ? 15 : 13.5,
                  lineHeight: 1.6,
                  fontWeight: 800,
                  color: isPlaying ? TOKENS.ink : TOKENS.inkSoft,
                  direction: "rtl",
                  textAlign: "center",
                  transition: "color 0.25s ease, font-size 0.25s ease",
                  // explicitly bubble-free: no container behind the words
                  background: "transparent",
                  border: "none",
                  boxShadow: "none",
                  borderRadius: 0,
                  padding: 0,
                  margin: 0,
                }}
              >
                {m.text}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                {isPlaying ? <Pause size={12} color={TOKENS.skyDeep} /> : <Play size={12} color={TOKENS.inkSoft} />}
                <Waveform active={isPlaying} />
              </div>
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 4,
                  fontFamily: "Nunito, sans-serif",
                  fontSize: 9.5,
                  fontWeight: 700,
                  color: style.hue,
                  opacity: 0.75,
                }}
              >
                <Sparkles size={9} /> تم رصد المزاج تلقائياً: {style.labelAr} {style.emoji}
              </div>
            </div>
          );
        })}
      </div>

      <div
        style={{
          padding: "8px 10px",
          display: "flex",
          alignItems: "center",
          gap: 3,
          fontFamily: "Nunito, sans-serif",
          fontSize: 10,
          color: TOKENS.inkSoft,
          justifyContent: "center",
        }}
      >
        <Sparkles size={11} /> tap a character to hear it speak — no bubbles, just voice
      </div>
    </div>
  );
}

function ComposeScreen() {
  const [recording, setRecording] = useState(false);
  const [text, setText] = useState("");
  const [sent, setSent] = useState(false);
  const mood = detectMood(text);
  const style = MOOD_STYLES[mood];

  const speak = (message, onDone) => {
    if (!message || !message.trim()) return;

    // Play the visual lip-sync immediately so the character always reacts,
    // even on browsers/devices where audio playback silently fails.
    setRecording(true);
    const estimatedMs = Math.min(6000, Math.max(1400, message.length * 70));
    const stopVisual = setTimeout(() => setRecording(false), estimatedMs);

    if (!("speechSynthesis" in window)) {
      setTimeout(() => {
        clearTimeout(stopVisual);
        setRecording(false);
        if (onDone) onDone();
      }, estimatedMs);
      return;
    }

    const doSpeak = () => {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(message);
      const voices = window.speechSynthesis.getVoices();
      const arabicVoice = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("ar"));
      if (arabicVoice) {
        utterance.voice = arabicVoice;
        utterance.lang = arabicVoice.lang;
      } else {
        utterance.lang = "en-US";
      }
      utterance.rate = 1;
      utterance.onstart = () => {
        clearTimeout(stopVisual);
        setRecording(true);
      };
      utterance.onend = () => {
        clearTimeout(stopVisual);
        setRecording(false);
        if (onDone) onDone();
      };
      utterance.onerror = (e) => {
        console.error("Speech error:", e);
      };
      window.speechSynthesis.speak(utterance);
    };

    const voices = window.speechSynthesis.getVoices();
    if (voices.length === 0) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.onvoiceschanged = null;
        doSpeak();
      };
    } else {
      doSpeak();
    }
  };

  const handleMicClick = () => {
    if (recording) {
      window.speechSynthesis.cancel();
      setRecording(false);
    } else {
      speak(text || "هلا، أنا أولي، جاهز أحچي رسالتك");
    }
  };

  const handleSend = () => {
    if (!text.trim()) return;
    speak(text, () => {
      setSent(true);
      setText("");
      setTimeout(() => setSent(false), 1600);
    });
  };

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
      <div style={{ padding: "14px 16px 6px", background: TOKENS.card, borderBottom: `1px solid ${TOKENS.parchmentDeep}` }}>
        <div style={{ fontFamily: "Baloo 2, sans-serif", fontWeight: 700, fontSize: 15, color: TOKENS.ink }}>
          New message
        </div>
      </div>

      <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, padding: 20 }}>
        <SpiritFace size={92} mood={mood} speaking={recording} />
        <div style={{ fontFamily: "Nunito, sans-serif", fontSize: 12, color: TOKENS.inkSoft }}>
          {sent ? "تم الإرسال ✓" : recording ? "Speaking your message…" : "This is how your character will speak"}
        </div>

        <div
          style={{
            display: "flex",
            alignItems: "center",
            gap: 6,
            padding: "6px 14px",
            borderRadius: 20,
            background: `${style.hue}1F`,
          }}
        >
          <Sparkles size={12} color={style.hue} />
          <span style={{ fontFamily: "Nunito, sans-serif", fontWeight: 700, fontSize: 11, color: TOKENS.ink }}>
            AI detected mood: {style.labelAr} {style.emoji}
          </span>
        </div>
        <div style={{ fontFamily: "Nunito, sans-serif", fontSize: 9.5, color: TOKENS.inkSoft, textAlign: "center", maxWidth: 220 }}>
          No manual picker — Nabdh reads what you write and updates the expression as you type
        </div>
      </div>

      <div style={{ padding: "10px 14px 16px", background: TOKENS.card, borderTop: `1px solid ${TOKENS.parchmentDeep}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <input
            value={text}
            onChange={(e) => setText(e.target.value)}
            placeholder="اكتب رسالتك..."
            style={{
              flex: 1,
              border: `1.5px solid ${TOKENS.parchmentDeep}`,
              borderRadius: 20,
              padding: "9px 14px",
              fontFamily: "Nunito, sans-serif",
              fontSize: 12,
              outline: "none",
              background: TOKENS.parchment,
              color: TOKENS.ink,
              direction: "rtl",
            }}
          />
          <button
            onClick={handleMicClick}
            style={{
              width: 38,
              height: 38,
              borderRadius: "50%",
              border: "none",
              background: recording ? TOKENS.emberDeep : TOKENS.sky,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              cursor: "pointer",
              boxShadow: recording ? `0 0 0 6px ${TOKENS.ember}33` : "none",
              transition: "box-shadow 0.3s ease",
              flexShrink: 0,
            }}
          >
            <Mic size={16} color="#fff" />
          </button>
          <button
            onClick={handleSend}
            style={{
              width: 38,
              height: 38,
              borderRadius: "50%",
              border: "none",
              background: TOKENS.leaf,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              cursor: "pointer",
              flexShrink: 0,
              opacity: text.trim() ? 1 : 0.5,
            }}
          >
            <Send size={15} color="#fff" />
          </button>
        </div>
      </div>
    </div>
  );
}

function AlertsScreen() {
  const [urgentOn, setUrgentOn] = useState(true);
  const [repeatEvery, setRepeatEvery] = useState(2);
  const [pulse, setPulse] = useState(true);

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
      <div style={{ padding: "14px 16px 6px", background: TOKENS.card, borderBottom: `1px solid ${TOKENS.parchmentDeep}` }}>
        <div style={{ fontFamily: "Baloo 2, sans-serif", fontWeight: 700, fontSize: 15, color: TOKENS.ink }}>
          Persistent alerts
        </div>
        <div style={{ fontFamily: "Nunito, sans-serif", fontSize: 11, color: TOKENS.inkSoft, marginTop: 2 }}>
          Urgent messages keep nudging until they're seen
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: 14, display: "flex", flexDirection: "column", gap: 12 }}>
        {urgentOn && (
          <div
            style={{
              borderRadius: 16,
              padding: "12px 14px",
              background: `linear-gradient(135deg, ${TOKENS.ember}, ${TOKENS.emberDeep})`,
              color: "#fff",
              display: "flex",
              alignItems: "center",
              gap: 10,
              boxShadow: pulse ? `0 0 0 6px ${TOKENS.ember}30` : "none",
              animation: pulse ? "alertPulse 1.6s ease-in-out infinite" : "none",
            }}
          >
            <Bell size={18} />
            <div style={{ fontFamily: "Nunito, sans-serif", fontSize: 12, lineHeight: 1.4 }}>
              <div style={{ fontWeight: 800 }}>Urgent from أولي</div>
              <div style={{ opacity: 0.9 }}>Repeats every {repeatEvery} min until opened</div>
            </div>
          </div>
        )}

        <div style={{ background: TOKENS.card, borderRadius: 16, padding: 14 }}>
          <Row
            label="Urgent alert priority"
            sub="Break through silent mode for flagged senders"
            control={<Toggle on={urgentOn} onChange={setUrgentOn} hue={TOKENS.ember} />}
          />
          <Divider />
          <Row
            label="Repeat reminder"
            sub={`Every ${repeatEvery} min until read`}
            control={
              <div style={{ display: "flex", gap: 6 }}>
                {[1, 2, 5].map((v) => (
                  <button
                    key={v}
                    onClick={() => setRepeatEvery(v)}
                    style={{
                      width: 28,
                      height: 28,
                      borderRadius: "50%",
                      border: `1.5px solid ${repeatEvery === v ? TOKENS.ember : TOKENS.parchmentDeep}`,
                      background: repeatEvery === v ? TOKENS.ember : "transparent",
                      color: repeatEvery === v ? "#fff" : TOKENS.inkSoft,
                      fontSize: 10,
                      fontFamily: "Nunito, sans-serif",
                      fontWeight: 800,
                      cursor: "pointer",
                    }}
                  >
                    {v}
                  </button>
                ))}
              </div>
            }
          />
          <Divider />
          <Row
            label="Pulsing glow preview"
            sub="Visual heartbeat on the lock screen banner"
            control={<Toggle on={pulse} onChange={setPulse} hue={TOKENS.sky} />}
          />
        </div>

        <div style={{ background: TOKENS.card, borderRadius: 16, padding: 14 }}>
          <div style={{ fontFamily: "Nunito, sans-serif", fontWeight: 800, fontSize: 12, color: TOKENS.ink, marginBottom: 8 }}>
            Priority contacts
          </div>
          {["أولي", "أبو خالد", "فريق العمل"].map((n, i) => (
            <div
              key={n}
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "space-between",
                padding: "6px 0",
              }}
            >
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <SpiritFace size={26} mood={["happy", "calm", "excited"][i]} hue={[TOKENS.sky, TOKENS.leaf, TOKENS.lavender][i]} />
                <span style={{ fontFamily: "Nunito, sans-serif", fontSize: 12, color: TOKENS.ink, direction: "rtl" }}>{n}</span>
              </div>
              <Volume2 size={13} color={TOKENS.inkSoft} />
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Row({ label, sub, control }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "8px 0" }}>
      <div>
        <div style={{ fontFamily: "Nunito, sans-serif", fontWeight: 700, fontSize: 12.5, color: TOKENS.ink }}>{label}</div>
        <div style={{ fontFamily: "Nunito, sans-serif", fontSize: 10.5, color: TOKENS.inkSoft, marginTop: 1 }}>{sub}</div>
      </div>
      {control}
    </div>
  );
}

function Divider() {
  return <div style={{ height: 1, background: TOKENS.parchmentDeep }} />;
}

function Toggle({ on, onChange, hue }) {
  return (
    <button
      onClick={() => onChange(!on)}
      style={{
        width: 40,
        height: 22,
        borderRadius: 12,
        border: "none",
        background: on ? hue : "#DDD5C0",
        position: "relative",
        cursor: "pointer",
        transition: "background 0.25s ease",
        flexShrink: 0,
      }}
    >
      <span
        style={{
          position: "absolute",
          top: 2,
          left: on ? 20 : 2,
          width: 18,
          height: 18,
          borderRadius: "50%",
          background: "#fff",
          transition: "left 0.25s ease",
          boxShadow: "0 1px 3px rgba(0,0,0,0.25)",
        }}
      />
    </button>
  );
}

function NabdhApp() {
  const [tab, setTab] = useState("chat");
  const screenLabel = { chat: "Chat", compose: "Compose", alerts: "Alerts" }[tab];

  return (
    <div
      style={{
        minHeight: "100%",
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        justifyContent: "center",
        gap: 18,
        padding: 24,
        background: `radial-gradient(circle at 20% 10%, ${TOKENS.lavender}22, transparent 55%), radial-gradient(circle at 80% 90%, ${TOKENS.sky}22, transparent 55%), ${TOKENS.parchmentDeep}`,
        fontFamily: "Nunito, sans-serif",
      }}
    >
      <style>{`
        @import url('${FONT_IMPORT_URL}');
        @keyframes auraPulse {
          0%, 100% { opacity: 0.6; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.08); }
        }
        @keyframes bodyBob {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-3px); }
        }
        @keyframes bar {
          0%, 100% { height: 4px; }
          50% { height: 18px; }
        }
        @keyframes alertPulse {
          0%, 100% { box-shadow: 0 0 0 0 rgba(232,147,92,0.35); }
          50% { box-shadow: 0 0 0 8px rgba(232,147,92,0); }
        }
        @keyframes stompLeg {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(3px); }
        }
        @keyframes headNod {
          0%, 100% { transform: rotate(0deg) translateY(0); }
          50% { transform: rotate(3deg) translateY(2px); }
        }
        @keyframes headTiltSway {
          0%, 100% { transform: rotate(-7deg); }
          50% { transform: rotate(-11deg); }
        }
      `}</style>

      <div style={{ textAlign: "center" }}>
        <div style={{ fontFamily: "Baloo 2, sans-serif", fontWeight: 700, fontSize: 22, color: TOKENS.ink }}>
          نبض <span style={{ color: TOKENS.skyDeep }}>Nabdh</span>
        </div>
        <div style={{ fontFamily: "Nunito, sans-serif", fontSize: 11.5, color: TOKENS.inkSoft }}>
          Messages that speak with feeling
        </div>
      </div>

      <PhoneChrome statusLabel={screenLabel}>
        {tab === "chat" && <ChatScreen />}
        {tab === "compose" && <ComposeScreen />}
        {tab === "alerts" && <AlertsScreen />}
        <TabBar active={tab} setActive={setTab} />
      </PhoneChrome>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NabdhApp />);
</script>
</body>
</html>
